# Fork-only: builds an unsigned (ad-hoc signed) macOS launcher for a manual test of the cloud
# files feature. Not for upstream; drop this file before any PR (craft-defaults.yml checks the
# Craft-defaults script).
#
# Runs on the Intel runner only: the arm64 (macos-latest) jobs of 2026-11-20 were never picked up
# ("The job was not acquired by Runner of type hosted"), while Intel ran every time. The app is
# still universal: the arm64 half is cross-compiled.
name: Mac test build

on:
  workflow_dispatch:
  push:
    branches: [feat/nextcloud-cloud-files]
    paths-ignore:
      - packaging/macos/set-craft-defaults.sh
      - .github/scripts/**
      - .github/workflows/craft-defaults.yml
      - docs/**

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Cloud tests on macOS
        run: cargo test -p artcraft-launcher-native --test it cloud
      # udinCraft updates (UR1): the macOS-only install checks (the ad hoc fork build's verifier
      # and its install path) compile and pass only here.
      - name: udinCraft update tests on macOS
        run: |
          cargo clippy --locked -p artcraft-launcher-core -p artcraft-launcher-native --all-targets -- -D warnings
          cargo test --locked -p artcraft-launcher-core -- udincraft
          cargo test --locked -p artcraft-launcher-native --lib -- udincraft macos_verify macos_checks
      - name: Package (universal, ad-hoc signed, not notarized)
        run: packaging/macos/package.sh --arch universal
      - name: Zip the app too
        run: |
          ditto -c -k --keepParent "target/macos-package/ArtCraft Launcher.app" dist/release/ArtCraft-Launcher-macos-universal.app.zip
          ls -lh dist/release
      - uses: actions/upload-artifact@v4
        with:
          name: artcraft-launcher-macos-universal
          path: |
            dist/release/*.dmg
            dist/release/*.app.zip
          retention-days: 30

