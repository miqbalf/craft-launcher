# Fork-only: checks packaging/macos/set-craft-defaults.sh against the upstream Craft app bundles
# of the versions installed on the owner's Mac (2026-11-27), and opens sample files in the office
# apps with open -a, as the launcher does. Not for upstream; drop it before any PR.
name: Craft defaults check

on:
  workflow_dispatch:
  push:
    branches: [feat/nextcloud-cloud-files]
    paths:
      - packaging/macos/set-craft-defaults.sh
      - .github/scripts/**
      - .github/workflows/craft-defaults.yml

permissions:
  contents: read

jobs:
  defaults:
    runs-on: macos-15-intel
    timeout-minutes: 30
    env:
      APPS: >-
        wordcraft:0.11.0 deckcraft:0.11.1 gridcraft:0.12.1 pdfcraft:0.14.0 photocraft:0.16.0
        vectorcraft:0.17.0 designcraft:0.13.0 cadcraft:0.13.0 filmcraft:0.13.0 soundcraft:0.13.1
        effectcraft:0.17.0 lightcraft:0.14.0
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        shell: bash -euo pipefail {0}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the upstream app bundles
        run: |
          mkdir -p "$RUNNER_TEMP/apps" "$RUNNER_TEMP/dmg"
          for av in $APPS; do
            a="${av%%:*}"; v="${av#*:}"
            gh release download "v$v" -R "storytold/$a" -p "$a-$v-macos-universal.dmg" -D "$RUNNER_TEMP/dmg"
            mnt="$(mktemp -d)"
            hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$RUNNER_TEMP/dmg/$a-$v-macos-universal.dmg" >/dev/null
            ditto "$mnt"/*.app "$RUNNER_TEMP/apps/$(basename "$mnt"/*.app)"
            hdiutil detach "$mnt" >/dev/null
          done
          ls "$RUNNER_TEMP/apps"
      - name: Dry run
        run: packaging/macos/set-craft-defaults.sh --dry-run --register --apps-dir "$RUNNER_TEMP/apps" 2>&1 | tee dry-run.txt
      - name: Set, check, restore (on this throwaway runner)
        run: |
          b="$RUNNER_TEMP/backup.json"
          packaging/macos/set-craft-defaults.sh --apps-dir "$RUNNER_TEMP/apps" --backup "$b" 2>&1 | tee set.txt
          packaging/macos/set-craft-defaults.sh --dry-run --apps-dir "$RUNNER_TEMP/apps" --backup "$b" 2>&1 | tee after-set.txt
          # A second run must not replace the saved originals with Craft handlers.
          cp "$b" backup-first.json
          packaging/macos/set-craft-defaults.sh --apps-dir "$RUNNER_TEMP/apps" --backup "$b" >/dev/null 2>&1
          cmp <(plutil -extract handlers json -o - backup-first.json) <(plutil -extract handlers json -o - "$b")
          packaging/macos/set-craft-defaults.sh --restore --backup "$b" 2>&1 | tee restore.txt
          packaging/macos/set-craft-defaults.sh --dry-run --apps-dir "$RUNNER_TEMP/apps" --backup "$b" 2>&1 | tee after-restore.txt
          cp "$b" backup.json
          # After the set, every planned type reports a Craft handler as current.
          if grep -E '^  .* -> ' after-set.txt | grep -v 'was: ai\.storyteller\.'; then
            echo "some types did not take their Craft handler" >&2; exit 1
          fi
      - name: Open sample files in the apps, as the launcher does (open -a)
        if: always()
        run: |
          python3 .github/scripts/make-office-samples.py "$RUNNER_TEMP/samples"
          for pair in WordCraft:sample.docx GridCraft:sample.xlsx DeckCraft:sample.pptx PdfCraft:sample.pdf; do
            app="${pair%%:*}"; file="${pair#*:}"
            open -a "$RUNNER_TEMP/apps/$app.app" "$RUNNER_TEMP/samples/$file"
            sleep 20
            if pgrep -f "$app.app/Contents/MacOS" >/dev/null; then echo "$app is running with $file"; else echo "$app is NOT running" >&2; fi
            screencapture -x "shot-$app.png" || true
            osascript -e "tell application \"System Events\" to get name of every window of (every process whose name is \"$app\")" 2>&1 | sed "s/^/$app windows: /" || true
            pkill -f "$app.app/Contents/MacOS" || true
            sleep 2
          done 2>&1 | tee open.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: craft-defaults-dry-run
          path: |
            dry-run.txt
            set.txt
            after-set.txt
            restore.txt
            after-restore.txt
            backup.json
            open.txt
            shot-*.png
          retention-days: 30
